packages:
  - apps/*
  - packages/*
  - tests
allowBuilds:
  '@parcel/watcher': set this to true or false
  esbuild: set this to true or false
  msgpackr-extract: set this to true or false
  unrs-resolver: set this to true or false
ignoredBuiltDependencies:
  - '@parcel/watcher'
  - msgpackr-extract
  - unrs-resolver
onlyBuiltDependencies:
  - esbuild
overrides:
  decode-uri-component@<=0.4.2: '>=0.5.0'
  decode-uri-component@<=0.5.0: '>=0.5.1'
  esbuild@>=0.27.3 <0.28.1: '>=0.28.1'
  glob@>=9.0.0 <=14.0.1: '>=14.0.2'
  minimatch@>=7.0.0 <11.0.1: '>=11.0.1'
  node-forge@<=1.4.0: '>=1.4.1'
  tinypool@<2.1.2: '>=2.1.2'
  tinypool@<=2.1.0: '>=2.1.1'
  uuid@<11.1.1: '>=11.1.1'
  vite@>=7.0.0 <=7.3.6: 7.3.7
  zod@<4.6.6: '>=4.6.6'
patchedDependencies:
  deepmerge@4.3.1: patches/deepmerge@4.3.1.patch
